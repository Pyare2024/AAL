name: Phase 4 Safe CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: "QG-1: Code Quality (Lint)"
        run: npm run lint

      - name: "QG-2: Production Build"
        run: npm run build

      - name: "QG-3: Unit & Integration Tests"
        run: npm run test

